<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talos Logo Animation</title>
<style>
  :root { --bg: #0e0f12; --fg: #ffffff; --muted: #8a8f98; --accent: #ff9400; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 16px; }
  svg { width: 100%; max-width: 1200px; height: auto; overflow: visible; }
  .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; color: var(--muted); }
  button { background: transparent; color: var(--fg); border: 1px solid #333; border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  input[type=range] { width: min(360px, 70vw); accent-color: var(--accent); }
  label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  #dot { transition: filter .4s; }
  #dot.glow { filter: drop-shadow(0 0 10px var(--accent)) drop-shadow(0 0 4px var(--accent)); }
</style>
</head>
<body>

    <g id="base">
      <g clip-path="url(#cBaseTop)">
        <g id="lower">

          <path id="dot" fill="#ff9400" d="M 557.201782 146.603485 C 545.124695 151.265259 531.555054 145.253937 526.893311 133.176788 C 522.231506 121.09964 528.242859 107.53006 540.319946 102.868286 C 552.397095 98.206482 565.966675 104.217804 570.628479 116.294952 C 575.290283 128.372101 569.278931 141.941681 557.201782 146.603485 Z"/>
        </g>
      </g>
      <path d="M 372 361 L 473 361 L 473 324 L 372 324 Z"/>
      <g id="upper">
        <path mask="url(#mElbow)" d="M 611.036621 129.777557 L 565.923706 150.814056 L 623.630127 274.565979 L 668.743103 253.52951 Z"/>
      </g>
      <g id="grip">
        <use href="#gripPath" clip-path="url(#cBody)"/>
        <g id="fingerL"><use href="#gripPath" clip-path="url(#cLeft)"/></g>
        <g id="fingerR"><use href="#gripPath" clip-path="url(#cRight)"/></g>
      </g>
    </g>
  </g>
</svg>

<div class="controls">
  <button id="play">Replay</button>
  <input id="scrub" type="range" min="0" step="0.01" value="0" aria-label="Timeline">
  <label><input id="loop" type="checkbox" checked> Loop</label>
  <label><input id="slow" type="checkbox"> Slow-mo</label>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const RAD = Math.PI / 180;

  // ---- Rig geometry (taken from Talos_Logo_v3.svg) ----
  const S0 = { x: 422, y: 340 };          // shoulder pivot (top of base plate)
  const E0 = { x: 548.75, y: 124.75 };    // elbow (ring centre)
  const W0 = { x: 648, y: 266 };          // wrist (gripper mount)
  const G  = { x: 693, y: 352 };          // pinch point between finger tips
  const BASE_PIVOT = { x: 422.5, y: 361 };// squash origin (bottom of base)
  const L1 = Math.hypot(E0.x - S0.x, E0.y - S0.y);
  const L2 = Math.hypot(W0.x - E0.x, W0.y - E0.y);
  const TH1R = Math.atan2(E0.y - S0.y, E0.x - S0.x);
  const TH2R = Math.atan2(W0.y - E0.y, W0.x - E0.x);
  const HOP = 200;                        // how far the base hops right to reach the slot

  const M = () => new DOMMatrix();
  const rotAbout = (m, deg, p) => m.translate(p.x, p.y).rotate(deg).translate(-p.x, -p.y);
  const css = m => `matrix(${m.a},${m.b},${m.c},${m.d},${m.e},${m.f})`;

  // Two-link IK, elbow kept "up" like the logo.
  function ik(wx, wy) {
    const dx = wx - S0.x, dy = wy - S0.y;
    const D = Math.min(Math.max(Math.hypot(dx, dy), Math.abs(L1 - L2) + 1e-3), L1 + L2 - 1e-3);
    const A = Math.acos((L1 * L1 + D * D - L2 * L2) / (2 * L1 * D));
    const th1 = Math.atan2(dy, dx) - A;
    const E = { x: S0.x + L1 * Math.cos(th1), y: S0.y + L1 * Math.sin(th1) };
    const th2 = Math.atan2(wy - E.y, wx - E.x);
    return { th1, th2, E };
  }

  function baseMatrix(p) {
    const sx = 1 + (1 - p.sq) * 0.6;
    return rotAbout(M().translate(p.bx, p.by), 0, BASE_PIVOT)
      .translate(BASE_PIVOT.x, BASE_PIVOT.y).scale(sx, p.sq).translate(-BASE_PIVOT.x, -BASE_PIVOT.y);
  }
  const gripMatrix = p => rotAbout(M().translate(p.wx - W0.x, p.wy - W0.y), p.ga, W0);

  // ---- Where the L starts: fallen down below its slot, leaning on one corner ----
  const DROP = 200, TILT = -8;
  const TEETER_PIVOT = { x: 788.7, y: 363 + DROP };   // its bottom-left corner
  const ML0 = rotAbout(M(), TILT, TEETER_PIVOT).translate(0, DROP);

  // ---- Place pose: gripper pointing straight down, pinching the top of the L's stem ----
  const PINCH = { x: 813.5, y: 178 };
  const PHI = 90 - Math.atan2(G.y - W0.y, G.x - W0.x) / RAD;
  const vg = new DOMPoint(G.x - W0.x, G.y - W0.y).matrixTransform(M().rotate(PHI));
  const PLACE = { bx: HOP, by: 0, sq: 1, wx: PINCH.x - vg.x - HOP, wy: PINCH.y - vg.y, ga: PHI };
  const M_PLACE = M().translate(HOP, 0).multiply(gripMatrix(PLACE));
  const K = M_PLACE.inverse();            // L = gripperWorld * K while held

  // Grab pose: whatever gripper pose holds the L exactly where it lies now.
  const MG = ML0.multiply(M_PLACE);
  const wg = new DOMPoint(W0.x, W0.y).matrixTransform(MG);
  const GRAB = { bx: HOP, by: 0, sq: 1, wx: wg.x - HOP, wy: wg.y, ga: Math.atan2(MG.b, MG.a) / RAD };

  // ---- Choreography ----
  const ease = {
    lin: t => t,
    io: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
    out: t => 1 - Math.pow(1 - t, 3),
    in: t => t * t * t,
    back: t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  };
  const REST = { bx: 0, by: 0, sq: 1, wx: W0.x, wy: W0.y, ga: 0, claw: 0 };
  const K_ = [];
  const k = (t, p = {}, e = 'io') => K_.push({ t, p, e });

  k(0,    REST);
  k(1.2);                                                        // asleep
  k(1.7,  { wx: 640, wy: 228, ga: -12, claw: .55 });              // wake / stretch
  k(2.0,  { wx: 650, wy: 236, ga: 4, claw: 0 });
  k(2.5,  { wx: 682, wy: 206, ga: -34 });                         // peer at the empty slot
  k(2.9);
  k(3.15, { wy: 196, ga: -14, claw: .3 }, 'out');                 // head tilt: "huh?"
  k(3.45, { wy: 204, ga: -34, claw: 0 });
  k(3.6);
  k(3.95, { wx: 572, wy: 186, ga: 122 });                         // glance back...
  k(4.2,  { wx: 640, wy: 200, ga: -22 }, 'out');                  // ...nothing there
  k(4.4);
  k(4.55, { wx: 716, wy: 232, ga: 22 }, 'back');                  // double take, looking down!
  k(4.7,  { wy: 220, claw: .85 }, 'out');                         // startled
  k(5.25);
  k(5.6,  { wx: 640, wy: 210, ga: 10, claw: .4, sq: .86 });       // crouch to hop
  k(5.85, { bx: HOP * .5, by: -60, sq: 1.07, wy: 190 }, 'out');   // hop!
  k(6.1,  { bx: HOP, by: 0, sq: .86, wx: 600, wy: 190 }, 'in');   // land beside it
  k(6.4,  { sq: 1 }, 'out');
  k(6.85, { wx: GRAB.wx, wy: GRAB.wy - 55, ga: GRAB.ga, claw: 1 }); // hover over the stem
  k(7.15, { wy: GRAB.wy });                                       // reach down
  k(7.35, { claw: 0 }, 'out');                                    // grip
  k(7.6,  { wy: GRAB.wy - 12, ga: GRAB.ga + 3 }, 'out');          // test tug
  k(8.5,  { wx: PLACE.wx, wy: PLACE.wy + 26, ga: PLACE.ga });     // haul it up
  k(9.1,  { wy: PLACE.wy });                                      // ease it into the slot
  k(9.6);
  k(9.85, { claw: .8 }, 'out');                                   // let go
  k(10.25,{ wx: PLACE.wx - 30, wy: PLACE.wy - 30, ga: PLACE.ga - 22, claw: .3 }); // back off
  k(10.55,{ ga: PLACE.ga - 12, claw: 0 });
  k(10.8, { ga: PLACE.ga - 34 }, 'out');                          // admire (head tilt)
  k(11.05,{ ga: PLACE.ga - 14 });
  k(11.4, { wx: 520, wy: 190, ga: -8, sq: .86 });                 // crouch to hop home
  k(11.65,{ bx: HOP * .5, by: -56, sq: 1.06, wy: 200 }, 'out');
  k(11.9, { bx: 0, by: 0, sq: .88, wx: W0.x, wy: 252, ga: 0 }, 'in');
  k(12.3, REST, 'back');                                          // settle into the logo
  const DUR = 15.5, T_GRIP = 7.28, T_DROP = 9.7, T_GLOW = 12.35;

  // Fill in carried-over props so every keyframe is complete.
  let prev = REST;
  for (const f of K_) { f.p = { ...prev, ...f.p }; prev = f.p; }

  function pose(t) {
    let i = 0;
    while (i < K_.length - 1 && K_[i + 1].t <= t) i++;
    const a = K_[i], b = K_[Math.min(i + 1, K_.length - 1)];
    if (a === b || t <= a.t) return a.p;
    const u = ease[b.e]((t - a.t) / (b.t - a.t));
    const out = {};
    for (const key in a.p) out[key] = a.p[key] + (b.p[key] - a.p[key]) * u;
    return out;
  }

  const el = {
    base: $('base'), lower: $('lower'), upper: $('upper'), grip: $('grip'),
    fL: $('fingerL'), fR: $('fingerR'), L: $('L'), dot: $('dot'),
  };

  function render(t) {
    const p = pose(t);
    const B = baseMatrix(p);
    const { th1, th2, E } = ik(p.wx, p.wy);
    const Gm = gripMatrix(p);

    el.base.setAttribute('transform', css(B));
    el.lower.setAttribute('transform', `rotate(${(th1 - TH1R) / RAD} ${S0.x} ${S0.y})`);
    el.upper.setAttribute('transform',
      css(rotAbout(M().translate(E.x - E0.x, E.y - E0.y), (th2 - TH2R) / RAD, E0)));
    el.grip.setAttribute('transform', css(Gm));
    el.fL.setAttribute('transform', `rotate(${p.claw * 18} 636 292)`);
    el.fR.setAttribute('transform', `rotate(${-p.claw * 14} 709 290)`);

    let Lm;
    if (t < T_GRIP) {
      // teeters when the arm notices it
      const s = t - 4.55, a = s > 0 ? 5 * Math.exp(-2.2 * s) * (1 - Math.cos(s * 11)) / 2 : 0;
      Lm = rotAbout(M(), -a, TEETER_PIVOT).multiply(ML0);
    }
    else if (t < T_DROP) Lm = B.multiply(Gm).multiply(K);
    else {
      // little boing as it lands
      const s = t - T_DROP, sy = 1 - 0.06 * Math.exp(-s * 7) * Math.cos(s * 28);
      Lm = M().translate(850, 363).scale(1 + (1 - sy) * .5, sy).translate(-850, -363);
    }
    el.L.setAttribute('transform', css(Lm));
    el.dot.classList.toggle('glow', t > T_GLOW && t < DUR - .6);
  }

  // ---- Playback ----
  const scrub = $('scrub'); scrub.max = DUR;
  let t = 0, last = null, playing = true;
  function tick(now) {
    if (last != null && playing) {
      t += (now - last) / 1000 * ($('slow').checked ? .35 : 1);
      if (t >= DUR) { if ($('loop').checked) t = 0; else { t = DUR; playing = false; } }
      scrub.value = t;
    }
    last = now;
    render(t);
    requestAnimationFrame(tick);
  }
  $('play').onclick = () => { t = 0; playing = true; };
  scrub.oninput = () => { t = +scrub.value; playing = false; };
  scrub.onchange = () => { playing = true; };
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); t = 0; playing = true; } });
  const qt = new URLSearchParams(location.search).get('t');
  if (qt != null) { t = +qt; playing = false; scrub.value = t; }
  render(t);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
